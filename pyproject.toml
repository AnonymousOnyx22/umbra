[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umbra"
version = "0.1.0"
description = "umbra - a local, Ollama-backed terminal coding assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=0.60.0",
    "ollama>=0.3.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
umbra = "umbra.tui:main"

[tool.setuptools]
packages = ["umbra"]
include-package-data = true

[tool.setuptools.package-data]
umbra = ["assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]